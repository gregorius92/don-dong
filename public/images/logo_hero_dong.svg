<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Generous 200% filter bounds to eliminate any boundary clipping -->
    <filter id="hero3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="3" dy="7" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="-3" dy="7" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#4ade80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
    .hero-brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -2px;
    }
    .hero-tagline-vn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- 3D "Đông" Wordmark Group -->
  <g filter="url(#hero3d)">
    
    <!-- Heavy Deep Green 3D Base -->
    <text x="400" y="245" class="hero-brand-text" font-size="240" fill="#072b16" stroke="#072b16" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <!-- Creamy Ivory Front Face -->
    <text x="400" y="245" class="hero-brand-text" font-size="240" fill="#faf7e8">
      Đông
    </text>

    <!-- Orange Circumflex Accent -->
    <g transform="translate(365, 65)">
      <!-- Orange Chevron 3D Shadow -->
      <path d="M 0,0 L 35,-28 L 70,0 L 57,12 L 35,-4 L 13,12 Z" fill="#072b16" stroke="#072b16" stroke-width="10" stroke-linejoin="round"/>
      <!-- Orange Chevron Face -->
      <path d="M 0,0 L 35,-28 L 70,0 L 57,12 L 35,-4 L 13,12 Z" fill="#e57e25"/>
    </g>

  </g>

  <!-- Tagline: "Giải nhiệt sau món cay" only -->
  <text x="400" y="365" class="hero-tagline-vn" font-size="38" fill="#ffffff" stroke="#051f0f" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill">
    Giải nhiệt sau món cay
  </text>
  <text x="400" y="365" class="hero-tagline-vn" font-size="38" fill="#dcfce7">
    Giải nhiệt sau món cay
  </text>
</svg>
