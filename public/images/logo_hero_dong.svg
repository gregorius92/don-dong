<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Heavy 3D Deep Forest Green Extrusion & Ambient Aura Filter -->
    <filter id="hero3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="4" dy="8" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="-4" dy="8" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="35" flood-color="#4ade80" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
    .hero-brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -3px;
    }
    .hero-tagline-vn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: 1px;
    }
  </style>

  <!-- 3D "Đông" Grand Wordmark Group -->
  <g filter="url(#hero3d)">
    
    <!-- Heavy Deep Green 3D Base -->
    <text x="450" y="265" class="hero-brand-text" font-size="290" fill="#072b16" stroke="#072b16" stroke-width="36" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <!-- Creamy Ivory Front Face -->
    <text x="450" y="265" class="hero-brand-text" font-size="290" fill="#faf7e8">
      Đông
    </text>

    <!-- Orange Circumflex Accent -->
    <g transform="translate(410, 48)">
      <!-- Orange Chevron 3D Shadow -->
      <path d="M 0,0 L 40,-32 L 80,0 L 65,14 L 40,-5 L 15,14 Z" fill="#072b16" stroke="#072b16" stroke-width="12" stroke-linejoin="round"/>
      <!-- Orange Chevron Face -->
      <path d="M 0,0 L 40,-32 L 80,0 L 65,14 L 40,-5 L 15,14 Z" fill="#e57e25"/>
    </g>

  </g>

  <!-- Tagline: "Giải nhiệt sau món cay" Grand Scale -->
  <text x="450" y="395" class="hero-tagline-vn" font-size="44" fill="#ffffff" stroke="#051f0f" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">
    Giải nhiệt sau món cay
  </text>
  <text x="450" y="395" class="hero-tagline-vn" font-size="44" fill="#dcfce7">
    Giải nhiệt sau món cay
  </text>
</svg>
