<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="100%" height="100%">
  <defs>
    <!-- Deep Green 3D Extrusion Filter -->
    <filter id="green3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="-3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#04180c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
    .brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -1px;
    }
    .tagline-vietnam {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .tagline-indo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Group with 3D shadow filter -->
  <g filter="url(#green3d)">
    
    <!-- "Đông" Main Dimensional Wordmark (Matching Official Poster) -->
    <!-- Heavy Deep Green Border -->
    <text x="220" y="175" class="brand-text" font-size="165" fill="#0b381e" stroke="#0b381e" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <!-- Creamy Ivory Face -->
    <text x="220" y="175" class="brand-text" font-size="165" fill="#f6f4df">
      Đông
    </text>

    <!-- Orange Circumflex / Roof Accent over 'o' -->
    <g transform="translate(196, 50)">
      <!-- Orange Chevron 3D Shadow -->
      <path d="M 0,0 L 24,-20 L 48,0 L 38,9 L 24,-3 L 10,9 Z" fill="#0b381e" stroke="#0b381e" stroke-width="8" stroke-linejoin="round"/>
      <!-- Orange Chevron Face -->
      <path d="M 0,0 L 24,-20 L 48,0 L 38,9 L 24,-3 L 10,9 Z" fill="#e57e25"/>
    </g>

  </g>

  <!-- Tagline Line 1 (Vietnamese): "Giải nhiệt sau món cay" -->
  <text x="220" y="260" class="tagline-vietnam" font-size="25" fill="#072b16">
    Giải nhiệt sau món cay
  </text>

  <!-- Tagline Line 2 (Indonesian Bold Red): "Perut Pedas Langsung Tuntas" -->
  <text x="220" y="315" class="tagline-indo" font-size="23" fill="#e63946">
    Perut Pedas Langsung Tuntas
  </text>
</svg>
