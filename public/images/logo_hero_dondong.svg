<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <!-- Heavy 3D Deep Forest Green Extrusion Filter -->
    <filter id="hero3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="4" dy="8" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="-4" dy="8" stdDeviation="0" flood-color="#051f0f"/>
      <feDropShadow dx="0" dy="22" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#4ade80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
    .hero-brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -2px;
    }
  </style>

  <!-- Group with 3D shadow & ambient green aura -->
  <g filter="url(#hero3d)">
    
    <!-- "Don" Top Word -->
    <text x="260" y="160" class="hero-brand-text" font-size="160" fill="#072b16" stroke="#072b16" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
      Don
    </text>
    <text x="260" y="160" class="hero-brand-text" font-size="160" fill="#faf7e8">
      Don
    </text>

    <!-- Orange Circumflex Accent -->
    <g transform="translate(242, 160)">
      <path d="M 0,0 L 18,-16 L 36,0 L 29,8 L 18,-2 L 7,8 Z" fill="#072b16" stroke="#072b16" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 0,0 L 18,-16 L 36,0 L 29,8 L 18,-2 L 7,8 Z" fill="#e57e25"/>
    </g>

    <!-- "Đông" Bottom Word -->
    <text x="260" y="305" class="hero-brand-text" font-size="170" fill="#072b16" stroke="#072b16" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <text x="260" y="305" class="hero-brand-text" font-size="170" fill="#faf7e8">
      Đông
    </text>

  </g>
</svg>
