<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="100%">
  <defs>
    <!-- Deep Green 3D Extrusion Filter -->
    <filter id="green3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="-3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#04180c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
    .brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -1px;
    }
    .tagline-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      text-anchor: middle;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Group with 3D shadow filter -->
  <g filter="url(#green3d)">
    
    <!-- "Don" Top Word -->
    <!-- Heavy Deep Green Border -->
    <text x="210" y="140" class="brand-text" font-size="118" fill="#0b381e" stroke="#0b381e" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
      Don
    </text>
    <!-- Creamy Ivory Face -->
    <text x="210" y="140" class="brand-text" font-size="118" fill="#f6f4df">
      Don
    </text>

    <!-- Orange Circumflex / Roof Accent over 'o' -->
    <g transform="translate(196, 138)">
      <!-- Orange Chevron 3D Shadow -->
      <path d="M 0,0 L 14,-14 L 28,0 L 22,6 L 14,-2 L 6,6 Z" fill="#0b381e" stroke="#0b381e" stroke-width="6" stroke-linejoin="round"/>
      <!-- Orange Chevron Face -->
      <path d="M 0,0 L 14,-14 L 28,0 L 22,6 L 14,-2 L 6,6 Z" fill="#e57e25"/>
    </g>

    <!-- "Đông" Bottom Word -->
    <!-- Heavy Deep Green Border -->
    <text x="210" y="245" class="brand-text" font-size="124" fill="#0b381e" stroke="#0b381e" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <!-- Creamy Ivory Face -->
    <text x="210" y="245" class="brand-text" font-size="124" fill="#f6f4df">
      Đông
    </text>

  </g>

  <!-- Tagline: "Cocok segar setelah makan pedas" -->
  <text x="210" y="305" class="tagline-text" font-size="20" fill="#072b16">
    Cocok segar setelah makan pedas
  </text>
</svg>
