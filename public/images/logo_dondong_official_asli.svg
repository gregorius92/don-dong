<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Generous 200% filter bounds -->
    <filter id="green3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="-3" dy="5" stdDeviation="0" flood-color="#072b16"/>
      <feDropShadow dx="0" dy="14" stdDeviation="8" flood-color="#04180c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
    .brand-text {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: -1px;
    }
    .tagline-vietnam {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Group with 3D shadow filter -->
  <g filter="url(#green3d)">
    
    <!-- "Đông" Main Dimensional Wordmark -->
    <text x="230" y="195" class="brand-text" font-size="185" fill="#0b381e" stroke="#0b381e" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
      Đông
    </text>
    <text x="230" y="195" class="brand-text" font-size="185" fill="#f6f4df">
      Đông
    </text>

    <!-- Orange Circumflex Accent -->
    <g transform="translate(202, 60)">
      <path d="M 0,0 L 28,-22 L 56,0 L 45,10 L 28,-3 L 11,10 Z" fill="#0b381e" stroke="#0b381e" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 0,0 L 28,-22 L 56,0 L 45,10 L 28,-3 L 11,10 Z" fill="#e57e25"/>
    </g>

  </g>

  <!-- Tagline (Vietnamese only): "Giải nhiệt sau món cay" -->
  <text x="230" y="295" class="tagline-vietnam" font-size="28" fill="#072b16">
    Giải nhiệt sau món cay
  </text>
</svg>
