services:
  - type: web
    name: nutrisari-dondong
    env: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "NutriSari DonDong"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/database/database.sqlite
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
